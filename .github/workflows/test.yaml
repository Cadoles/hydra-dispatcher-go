name: Test

on:
  push:
    branches: [master, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # For the integration tests (tag integration): the major of production.
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: dispatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # The state store's (P8); Dragonfly, hydra-dev's server, runs locally
      # (README).
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # setup-go may install the go directive's version and set
      # GOTOOLCHAIN=local: name the toolchain directive's, the image's, which
      # the go command then fetches. Fail if another one still runs.
      - name: Toolchain
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"

      - name: Go version
        run: |
          go version
          test "$(go env GOVERSION)" = "$(sed -n 's/^toolchain //p' go.mod)"

      - name: Tidy
        run: go mod tidy -diff

      # The go command checks a module against go.sum when it downloads it,
      # not in the module cache setup-go restores.
      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      # go fmt runs the gofmt of that toolchain, gofmt alone the installed one.
      - name: Format
        run: out=$(go fmt ./...); test -z "$out" || { echo "$out"; exit 1; }

      - name: Vet
        run: go vet ./... && go vet -tags integration ./...

      # Tool versions are pinned by the tool directive in go.mod.
      - name: Staticcheck
        run: go tool staticcheck ./... && go tool staticcheck -tags integration ./...

      - name: Govulncheck
        run: go tool govulncheck ./...

      - name: Test
        run: go test -race ./...

      # The job runs on the runner itself, the services in containers beside
      # it: they are reached on localhost, by the ports they publish. Without
      # DATABASE_URL or REDIS_URLS, the tests fail rather than skip.
      - name: Integration tests
        env:
          DATABASE_URL: postgres://postgres:dispatcher@localhost:5432/postgres?sslmode=disable
          REDIS_URLS: redis://localhost:6379/0
        run: go test -race -tags integration ./internal/store/... ./internal/state/... ./internal/admin/... ./cmd/... ./tools/symfonyimport/...

      # Built, never pushed: a Dockerfile or .dockerignore error shows here,
      # not at release. The same BuildKit as the release workflow. Actions and
      # images pinned by digest, bumped by Renovate (renovate.json).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e

      - name: Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          provenance: false
          outputs: type=docker,dest=/tmp/dispatcher-image.tar

      # The image scanned by Trivy, the scanner of Harbor: govulncheck reads the
      # database of Go alone, which may lag behind the advisories of GitHub
      # (go-jose, at the release 1.0.0). Fails on a vulnerability with a fix,
      # MEDIUM and above, of a Go module or a package of distroless. The
      # entries of the database of Go have no severity in Trivy (UNKNOWN):
      # govulncheck keeps them, knowing whether the code calls them
      # (GO-2026-5932, x/crypto's openpgp, not imported).
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.76.2 # renovate: datasource=github-releases depName=aquasecurity/trivy
        run: |
          case "$(uname -m)" in
            x86_64) arch=64bit sum=bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf ;;
            aarch64) arch=ARM64 sum=ab9d51f86e6a5fb936f605faff6b593ac51bc378fff4d3e8b9d58358b9c367c3 ;;
            *) echo "no Trivy pinned for $(uname -m)"; exit 1 ;;
          esac
          dir="${RUNNER_TEMP:-/tmp}/trivy-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            -o "$dir/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-${arch}.tar.gz"
          echo "${sum}  $dir/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$dir/trivy.tar.gz" -C "$dir" trivy
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan the image
        run: |
          trivy image --input /tmp/dispatcher-image.tar --scanners vuln \
            --ignore-unfixed --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --no-progress

  # examples/theme-demo (Q91): the check of serve on it, and its theme.css built
  # again by the pinned Tailwind CLI, the committed one the same.
  theme-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Toolchain
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"

      - name: Theme check
        run: go run ./cmd/hydra-dispatcher theme check examples/theme-demo

      # theme.css committed, and as build.sh writes it: git diff alone passes an
      # untracked file, one a commit removed and build.sh wrote again (revue R32).
      - name: theme.css built
        run: |
          examples/theme-demo/build.sh
          git ls-files --error-unmatch examples/theme-demo/static/theme.css
          git diff --exit-code -- examples/theme-demo/static/theme.css

  # web/scalar (P17) and web/pico (P20): the bundle of /admin/v1/docs and the
  # sheet of the admin UI fetched again by their fetch.sh, the integrity and
  # the sum checked, the committed ones the same.
  scalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: standalone.js fetched again
        run: |
          web/scalar/fetch.sh
          git ls-files --error-unmatch web/scalar/standalone.js
          git diff --exit-code -- web/scalar/standalone.js

      - name: pico.classless.min.css fetched again
        run: |
          web/pico/fetch.sh
          git ls-files --error-unmatch web/pico/pico.classless.min.css web/pico/LICENSE.md
          git diff --exit-code -- web/pico/

